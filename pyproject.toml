[project]
name = "openflight"
version = "0.2.0"
description = "DIY golf launch monitor using OPS243-A Doppler radar"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "OpenFlight Contributors" }
]
keywords = ["golf", "launch-monitor", "doppler", "radar", "ops243", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pyserial>=3.5",
    "numpy>=1.20.0",
    # SciPy 1.18 changes the resting-ball fit; retain the regression-tested range.
    "scipy>=1.10.0,<1.18",
    "tomli>=2.0.1; python_version < '3.11'",
    # Camera tracking is currently disabled; keep these out of the base install.
    # "trackers @ git+https://github.com/roboflow/trackers.git",
    # "supervision>=0.26.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "flask-socketio>=5.6.1",
    # K-LD7 angle radar driver — deprecated hardware, kept for existing builds.
    "kld7>=0.2.1",
    "gpiozero>=2.0.1; sys_platform == 'linux'",
    "lgpio>=0.2.2.0; sys_platform == 'linux'",
    "smbus2>=0.5.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
ui = [
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "flask-cors>=4.0.0",
    "python-socketio>=5.10.0",
    "eventlet>=0.35.0",
]
# Camera estimators and camera-tab preview encoding. Picamera2 is installed
# through Raspberry Pi OS because it is coupled to the platform's libcamera.
camera = [
    "opencv-python-headless>=4.8.0",
]
# Analysis tools for I/Q capture data
analysis = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0,<1.18",
]
# Bluetooth Low Energy GATT server for the optional iOS connection.
ble = [
    # The GATT server runs on the Raspberry Pi. Keeping the marker here also
    # prevents universal resolvers from pulling Bless's Windows-only beta
    # dependencies into macOS/Linux development environments.
    "bless==0.3.0; sys_platform == 'linux'",
]

[project.scripts]
openflight-server = "openflight.server:main"
openflight-cloud = "openflight.cloud.cli:main"

# Kiosk extensions, loaded by openflight-server at start-up: the shot models (club
# arc, collision model, full speeds, flight: E1-E4) and, fork-only, the tester's
# hooks, the research hooks (Pi trace, fusion snapshots) and the live impact reading.
[project.entry-points."openflight.kiosk_extensions"]
shot_models = "openflight.shot_models:extension"
tester = "openflight.tester_hooks:extension"
research = "openflight.research_hooks:extension"
impact_live = "openflight.camera.impact_live:extension"

# The shot models' metrics in the shot-metric catalogue (E1-E6), loaded on first use.
[project.entry-points."openflight.shot_metrics"]
shot_models = "openflight.model_metrics"

[project.urls]
Homepage = "https://github.com/open-flight/openflight"
Repository = "https://github.com/open-flight/openflight"
Issues = "https://github.com/open-flight/openflight/issues"
Documentation = "https://github.com/open-flight/openflight#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/openflight"]

[dependency-groups]
dev = [
    "pylint>=3.3.9",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "ruff==0.9.10",  # the pre-commit hook's version (.pre-commit-config.yaml)
]
# Documentation site. Zensical is pre-1.0, so pin the minor to keep CI and
# local builds on the same renderer.
docs = [
    "zensical>=0.0.57,<0.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Upstream files upstream has not run ruff format on: kept in upstream's layout so
# the fork's diff of them is its code changes only. (format.exclude adds to exclude.)
exclude = [
    "scripts/analysis/compare_trackman.py",
    "scripts/analysis/experiment_spin_windows.py",
    "scripts/analysis/sweep_ballistic_coeffs.py",
    "scripts/analysis/validate_ballistics.py",
    "src/openflight/ballistics.py",
    "src/openflight/iwr6843/trajectory.py",
    "src/openflight/ops243.py",
    "tests/conftest.py",
    "tests/test_compare_trackman.py",
    "tests/test_gspro_messages.py",
    "tests/test_launch_monitor.py",
    "tests/test_ops243.py",
    "tests/test_sim_resolver.py",
    "tests/test_sim_server_wiring.py",
    "tests/test_sim_transport.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line length handled separately

[tool.ruff.lint.isort]
# Combine `from x import (a, b as c)` into one block instead of splitting the
# aliased member into its own statement (ruff's default). Keeps single-module
# imports as one block, e.g. `from .sim import (..., PlayerState as SimPlayerState)`.
combine-as-imports = true

[tool.uv]
# OpenFlight's declared platforms are Linux (the Pi) and macOS (development).
# Excluding Windows also keeps Linux-only Bless resolution from traversing its
# incompatible Windows beta dependency branch.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    # Fork: development and the bench run on Windows too. Bless stays
    # Linux-only by its own marker, so Windows never resolves it.
    "sys_platform == 'win32'",
]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.messages_control]
disable = [
    "too-many-instance-attributes",  # Radar and monitor classes need many attributes
    "too-many-public-methods",       # Radar API has many commands
    "too-many-locals",               # Distance estimation lookup table
    "too-many-statements",           # CLI main function
    "import-outside-toplevel",       # argparse in main() is fine
    "broad-exception-caught",        # Generic catch in streaming loop is intentional
    "invalid-name",                  # Allow DRIVER_TABLE, CLUB_FACTORS constants
    "duplicate-code",                # MockLaunchMonitor duplicates interface intentionally
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
