% Diagnostic setup profile for a far patch (P8-1, P8-3): one fixed pre-MTI range
% window for static differencing, widened to bins 8-79 (0.375-3.70 m apparent)
% so a patch centred up to 3 m out, with its far edge and the search margin, stays
% inside it. The 24-frame profile's bins 8-60 end at 2.81 m apparent (about 2.75 m
% corrected), which a patch centred beyond about 2.3 m outgrows. 72 bins leave room
% for 18 frames in the L3 ring (746 KB against 733 KB; about the same transfer).
% 18 frames x 3 ms = 54 ms, 3 TX, 12 loops, IQ16 storage. The static gate needs at
% least 12 frames. Chosen automatically when the patch's radar window reaches past
% the 24-frame profile.
% Do not use this profile for shot launch estimation: it removes the phased
% window plan that follows the moving ball.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 3 1 0
captureFormat iq16
phaseCaptureCfg 8 72 6 8 72 6 8 72 8 6 1
lowPower 0 0
sensorStart
