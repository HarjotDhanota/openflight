% Experimental net-calibration capture; launch-angle accuracy is unqualified.
% 48 frames x 5 ms = 240 ms, 3 TX, 4 loops, 84 bins, full IQ16 storage.
% Dedicated collector only; preserve the normal launch profile and setup record.
% Post-request coverage is 195 ms; bins 44-127 cover about 2.06-5.95 m apparent.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 4 0 5 1 0
captureFormat iq16
phaseCaptureCfg 20 84 9 44 84 7 44 84 44 32 1
lowPower 0 0
sensorStart
