% Diagnostic setup profile: one fixed pre-MTI range window for static differencing.
% 24 frames x 3 ms = 72 ms, 3 TX, 12 loops, bins 8-60, IQ16 storage.
% Do not use this profile for shot launch estimation: it removes the phased
% window plan that follows the moving ball.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 3 1 0
captureFormat iq16
phaseCaptureCfg 8 53 9 8 53 7 8 53 8 8 1
lowPower 0 0
sensorStart
