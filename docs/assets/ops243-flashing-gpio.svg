<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi to OPS243-A power and v1.3.3 signal wiring</title>
<desc id="desc">Illustrated Pi 5 and OPS243-A. Pi physical pin 4 supplies 5 V to radar J3 pin 9. Pi physical pin 14 connects to radar J3 pin 10 for ground. The added v1.3.3 signal wire connects radar J3 pin 1 to Pi physical pin 13, GPIO27. Existing UART wires remain connected but are omitted from this diagram. The breakout ribbon plugs into J2, and the probe USB plugs into a Pi USB port.</desc>
